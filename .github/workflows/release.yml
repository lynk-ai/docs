# Release the shippable unit: docs/ and nothing above it.
#
# Push a tag like v1.2.0 and this packages docs/ into a tarball and attaches
# it to a GitHub Release. `.gitbook/` is GitBook's own asset store — it serves
# the hosted site, not a consumer of the tarball, so it stays out. Gated the
# same way scripts/render-to-plugin.sh gates a render: the router must be
# current and the static docs lint must pass. The router check fails (rather
# than regenerates) so the tarball always matches the tagged tree exactly.

name: Release docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check router is current
        run: |
          python3 scripts/generate_router.py
          git diff --exit-code docs/concepts/README.md || {
            echo "::error::docs/concepts/README.md router is stale — run scripts/generate_router.py, commit, and re-tag" >&2
            exit 1
          }

      - name: Lint docs
        working-directory: evals/ask-docs
        run: uv run pytest -m "not evaluation" -q

      - name: Package docs
        run: |
          tar -czf "lynk-docs-${GITHUB_REF_NAME}.tar.gz" \
            --exclude='docs/.gitbook' \
            docs

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "lynk-docs-${GITHUB_REF_NAME}.tar.gz" \
            --title "Lynk docs $GITHUB_REF_NAME" \
            --generate-notes
