name: Release docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like vX.Y.Z, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check router is current
        run: |
          python3 scripts/generate_router.py
          git diff --exit-code docs/concepts/README.md || {
            echo "::error::docs/concepts/README.md router is stale — run scripts/generate_router.py, commit, and re-tag" >&2
            exit 1
          }

      - name: Lint docs
        working-directory: evals/ask-docs
        run: uv run pytest -m "not evaluation" -q

      - name: Tag
        if: github.event_name != 'push'
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::tag $version already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Lynk docs $version"
          git push origin "$version"

      - name: Package docs
        run: |
          tar -czf "lynk-docs-${{ steps.version.outputs.version }}.tar.gz" \
            --exclude='docs/.gitbook' \
            docs

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$version" \
            "lynk-docs-${version}.tar.gz" \
            --title "Lynk docs $version" \
            --generate-notes
